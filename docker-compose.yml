# Полный стек: инфраструктура + API + Celery worker + веб-клиент (nginx).
# Запуск: docker compose up -d --build
# Клиент: http://localhost:5173  API: http://localhost:8000  MinIO: http://localhost:9001

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg2://audiobooks:audiobooks@postgres:5432/audiobooks
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  S3_ENDPOINT_URL: http://minio:9000
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin
  S3_BUCKET: audiobooks
  S3_PUBLIC_BASE_URL: http://localhost:9000/audiobooks
  UPLOAD_TEMP_DIR: /tmp/audiobooks
  TTS_PROVIDER: mock

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: audiobooks
      POSTGRES_PASSWORD: audiobooks
      POSTGRES_DB: audiobooks
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audiobooks -d audiobooks"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/audiobooks || true &&
      mc anonymous set download local/audiobooks
      "

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - path: ./server/.env
        required: false
    environment:
      <<: *backend-env
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    volumes:
      - upload_temp:/tmp/audiobooks
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  worker:
    build:
      context: ./server
      dockerfile: Dockerfile.worker
    env_file:
      - path: ./server/.env
        required: false
    environment:
      <<: *backend-env
    volumes:
      - upload_temp:/tmp/audiobooks
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
  upload_temp:
